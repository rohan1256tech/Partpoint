name: android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install SDK platform 37.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APKs
        run: ./gradlew :app-partpoint:assembleDebug :app-delivery:assembleDebug
      - name: Keep the APKs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks-${{ github.sha }}
          path: android/app-*/build/outputs/apk/debug/*.apk
          retention-days: 14
