name: backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partpoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: partpoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U partpoint"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://partpoint:ci-only@localhost:5432/partpoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrations match schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit it."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Docker image builds
        run: docker build -t partpoint-api:ci .

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS (only the api container restarts)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/partpoint/backend
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml build api
            docker compose -f docker-compose.yml run --rm api node dist/db/migrate.js
            docker compose -f docker-compose.yml up -d --no-deps api
            for i in $(seq 1 30); do
              docker compose -f docker-compose.yml exec -T api wget -qO- http://127.0.0.1:3000/health && exit 0
              sleep 2
            done
            echo "health check failed after deploy" >&2
            exit 1
