# Sized for a 8 GB machine running Docker alongside.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Partpoint build settings -------------------------------------------------------------
# Application IDs are permanent once an app is on Google Play. Confirm the client's domain
# before the first upload (e.g. com.clientname.partpoint), then never change it.
partpoint.appIdPrefix=in.partpoint
# Release builds call this API (HTTPS only). Override per environment, e.g. in CI:
#   ./gradlew assembleRelease -Ppartpoint.apiBaseUrl=https://api.example.in/
partpoint.apiBaseUrl=https://api.example.invalid/
# Debug builds talk to the local backend: 10.0.2.2 is the host machine from the Android emulator.
partpoint.debugApiBaseUrl=http://10.0.2.2/
